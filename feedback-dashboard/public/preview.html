<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .fade-in { animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
  .card { background:#fff; border-radius:12px; border:1px solid #e5e7eb; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .tab { padding:6px 14px; border-radius:8px; font-size:13px; font-weight:500; cursor:pointer; color:#6b7280; transition:all .15s; white-space:nowrap; }
  .tab.active { background:#2563eb; color:#fff; }
  .tab:not(.active):hover { background:#f3f4f6; color:#374151; }
  .group-card { border:1px solid #e5e7eb; border-radius:10px; overflow:hidden; transition:border-color .15s; }
  .group-card:hover { border-color:#d1d5db; }
  .group-header { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; cursor:pointer; background:#fff; }
  .group-header:hover { background:#f9fafb; }
  .feedback-item { padding:12px 16px; border-top:1px solid #f3f4f6; background:#fafafa; }
  .feedback-item:hover { background:#f3f4f6; }
  .badge { display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:22px; border-radius:99px; font-size:11px; font-weight:700; padding:0 6px; }
  input[type=password], input[type=text], input[type=date] {
    border:1px solid #d1d5db; border-radius:8px; padding:8px 12px; font-size:13px; width:100%; outline:none; transition:border-color .15s;
  }
  input:focus { border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.1); }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

let currentTab = '전체';
let openGroups = new Set();

function runDemo() {
  const loading = document.getElementById('loading');
  const result = document.getElementById('result');
  loading.classList.remove('hidden'); loading.classList.add('flex');
  result.classList.add('hidden');
  setTimeout(() => { document.getElementById('loading-text').textContent = 'Claude AI로 유사 피드백 묶는 중...'; }, 1500);
  setTimeout(() => {
    loading.classList.add('hidden'); loading.classList.remove('flex');
    result.classList.remove('hidden'); result.classList.add('fade-in');
    renderGroups(currentTab);
  }, 2800);
}

function switchTab(el, tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentTab = tab;
  renderGroups(tab);
}

function renderGroups(tab) {
  const filtered = tab === '전체' ? groups : groups.filter(g => g.category === tab);
  const sorted = [...filtered].sort((a,b) => b.count - a.count);
  const container = document.getElementById('group-list');
  if (sorted.length === 0) {
    container.innerHTML = '<p class="text-sm text-gray-400 text-center py-10">해당 카테고리의 피드백이 없습니다.</p>';
    return;
  }
  container.innerHTML = sorted.map(g => {
    const color = CATEGORY_COLORS[g.category] || '#9ca3af';
    const isOpen = openGroups.has(g.id);
    return `
    <div class="group-card">
      <div class="group-header" onclick="toggleGroup('${g.id}')">
        <div class="flex items-center gap-3 min-w-0">
          <span class="badge text-white flex-shrink-0" style="background:${color}">${g.count}</span>
          <div class="min-w-0">
            <p class="text-sm font-medium text-gray-800 truncate">${g.title}</p>
            <p class="text-xs text-gray-400 mt-0.5 truncate">${g.summary}</p>
          </div>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0 ml-3">
          <span class="text-xs px-2 py-0.5 rounded-full font-medium" style="background:${color}18;color:${color}">${g.category}</span>
          <svg class="w-4 h-4 text-gray-400 transition-transform ${isOpen ? 'rotate-180' : ''}" id="arrow-${g.id}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"/></svg>
        </div>
      </div>
      <div id="items-${g.id}" class="${isOpen ? '' : 'hidden'}">
        ${g.feedbacks.map(f => `
          <div class="feedback-item">
            <div class="flex items-start justify-between gap-2">
              <p class="text-xs text-gray-700 leading-relaxed flex-1">${f.title}</p>
              <a href="${f.threadUrl}" target="_blank"
                class="flex-shrink-0 flex items-center gap-1 text-xs text-blue-500 hover:text-blue-700 font-medium whitespace-nowrap">
                스레드
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>
              </a>
            </div>
            <div class="flex flex-wrap gap-1.5 mt-2">
              <span class="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded">${f.channel}</span>
              <span class="text-xs bg-purple-50 text-purple-600 px-2 py-0.5 rounded">${f.plan}</span>
              <span class="text-xs text-gray-400">${f.date} · @${f.author}</span>
            </div>
          </div>
        `).join('')}
      </div>
    </div>`;
  }).join('');
}

function toggleGroup(id) {
  if (openGroups.has(id)) openGroups.delete(id);
  else openGroups.add(id);
  renderGroups(currentTab);
}
</script>
</body>
</html>
