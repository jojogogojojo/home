<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>채널톡 문서 자동 생성기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }

    /* ─── Header ─────────────────────────────── */
    header {
      background: #ffffff;
      border-bottom: 1px solid #e8eaf0;
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .logo { font-size: 17px; font-weight: 700; color: #6c5ce7; letter-spacing: -0.3px; }
    .logo span { color: #1a1a2e; }
    .header-actions { display: flex; gap: 10px; }

    .btn-icon {
      background: none;
      border: 1px solid #dde1ee;
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
      font-size: 13px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all .15s;
    }
    .btn-icon:hover { background: #f5f5ff; border-color: #6c5ce7; color: #6c5ce7; }

    /* ─── Main Layout ─────────────────────────── */
    main {
      max-width: 1100px;
      margin: 28px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      main { grid-template-columns: 1fr; }
    }

    /* ─── Card ────────────────────────────────── */
    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
    }
    .card-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: #6c5ce7;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .card-title .icon { font-size: 16px; }

    /* ─── Full-width cards ─────────────────────── */
    .full { grid-column: 1 / -1; }

    /* ─── Textarea / Inputs ───────────────────── */
    textarea, input[type="text"] {
      width: 100%;
      border: 1.5px solid #e0e3f0;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      font-family: inherit;
      color: #1a1a2e;
      resize: vertical;
      transition: border-color .15s;
      background: #fafbff;
      outline: none;
    }
    textarea:focus, input[type="text"]:focus {
      border-color: #6c5ce7;
      background: #fff;
    }
    textarea { min-height: 140px; line-height: 1.6; }
    textarea.guidelines { min-height: 100px; }

    /* ─── Image Upload ────────────────────────── */
    .upload-area {
      border: 2px dashed #d0d4ee;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all .2s;
      margin-top: 12px;
      background: #fafbff;
    }
    .upload-area:hover { border-color: #6c5ce7; background: #f5f3ff; }
    .upload-area.has-file { border-color: #00b894; background: #f0fdf9; }
    .upload-area p { font-size: 13px; color: #888; margin-top: 6px; }
    .upload-area .upload-icon { font-size: 28px; }
    #fileInput { display: none; }
    .preview-images {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .preview-images .img-wrap {
      position: relative;
      width: 72px;
      height: 72px;
    }
    .preview-images img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #e0e3f0;
    }
    .preview-images .remove-img {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #ff4757;
      color: white;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ─── Action buttons ─────────────────────── */
    .action-row {
      display: flex;
      gap: 12px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 11px 22px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      color: white;
      box-shadow: 0 3px 10px rgba(108,92,231,.3);
    }
    .btn-primary:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(108,92,231,.4); }

    .btn-success {
      background: linear-gradient(135deg, #00b894, #00cec9);
      color: white;
      box-shadow: 0 3px 10px rgba(0,184,148,.3);
    }
    .btn-success:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(0,184,148,.4); }

    .btn-outline {
      background: white;
      color: #555;
      border: 1.5px solid #dde1ee;
    }
    .btn-outline:hover { border-color: #6c5ce7; color: #6c5ce7; }

    /* ─── Result Preview ─────────────────────── */
    #resultArea {
      display: none;
    }
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    #docTitle {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #1a1a2e;
      padding: 10px 14px;
      border: 1.5px solid #e0e3f0;
      border-radius: 8px;
      width: 100%;
    }
    #docBody {
      min-height: 220px;
      font-size: 14px;
      line-height: 1.7;
    }

    /* ─── Status bar ─────────────────────────── */
    #statusBar {
      display: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      align-items: center;
      gap: 8px;
    }
    #statusBar.loading { display: flex; background: #eef2ff; color: #6c5ce7; }
    #statusBar.success { display: flex; background: #e8fdf5; color: #00864f; }
    #statusBar.error   { display: flex; background: #fff0f0; color: #d63031; }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #c5bfff;
      border-top-color: #6c5ce7;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Settings Modal ─────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: white;
      border-radius: 18px;
      padding: 30px;
      width: 520px;
      max-width: 95vw;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }
    .modal h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 22px;
      color: #1a1a2e;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #666;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 6px;
    }
    .form-group .hint {
      font-size: 11px;
      color: #aaa;
      margin-top: 4px;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
    }
    .form-group input {
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 12px;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 24px;
    }

    /* ─── Setup banner ─────────────────────────── */
    #setupBanner {
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      color: white;
      padding: 16px 24px;
      text-align: center;
      font-size: 14px;
      display: none;
    }
    #setupBanner.show { display: block; }
    #setupBanner a { color: #fff; font-weight: 700; cursor: pointer; text-decoration: underline; }

    /* ─── Section label ────────────────────────── */
    .section-label {
      font-size: 12px;
      color: #888;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 6px;
      margin-top: 14px;
    }
    .section-label:first-child { margin-top: 0; }

    /* ─── Success toast ────────────────────────── */
    #toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #1a1a2e;
      color: white;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 6px 20px rgba(0,0,0,.25);
      transform: translateY(80px);
      opacity: 0;
      transition: all .3s;
      z-index: 9999;
      max-width: 340px;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.ok { background: #00864f; }
    #toast.err { background: #c0392b; }
  </style>
</head>
<body>

<!-- Setup banner -->
<div id="setupBanner" class="show">
  ⚙️ API 키가 설정되지 않았어요. 먼저 <a onclick="openSettings()">설정</a>을 완료해주세요.
</div>

<!-- Header -->
<header>
  <div class="logo">채널톡 <span>문서 자동 생성기</span></div>
  <div class="header-actions">
    <button class="btn-icon" onclick="openSettings()">⚙️ 설정</button>
  </div>
</header>

<!-- Main -->
<main>

  <!-- LEFT: Input -->
  <div>

    <!-- Guidelines -->
    <div class="card" style="margin-bottom:20px">
      <div class="card-title"><span class="icon">📋</span> 지침 / 스타일 가이드</div>
      <p class="section-label">이 내용을 참고해서 문서를 작성해줘</p>
      <textarea class="guidelines" id="guidelines" placeholder="예시:
• 말투는 존댓말을 사용하세요
• 소제목을 사용해서 읽기 쉽게 작성하세요
• 핵심 내용은 목록(•)으로 정리하세요
• 채널톡 도움말 문서 형식으로 작성하세요"></textarea>
    </div>

    <!-- Content input -->
    <div class="card">
      <div class="card-title"><span class="icon">✏️</span> 입력 내용</div>

      <p class="section-label">텍스트</p>
      <textarea id="contentText" placeholder="여기에 내용을 붙여넣거나 직접 입력하세요.

예) 제품 업데이트 내용, 기능 설명, 공지사항 초안 등 무엇이든 넣어주세요."></textarea>

      <p class="section-label">이미지 (선택)</p>
      <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">🖼️</div>
        <p>클릭해서 이미지 첨부<br><small>JPG, PNG, GIF, WebP</small></p>
      </div>
      <input type="file" id="fileInput" multiple accept="image/*">
      <div class="preview-images" id="previewImages"></div>

      <div class="action-row">
        <button class="btn btn-primary" id="generateBtn" onclick="generateDraft()">
          ✨ 초안 생성
        </button>
        <button class="btn btn-outline" onclick="clearAll()">🗑️ 초기화</button>
      </div>
    </div>

  </div>

  <!-- RIGHT: Result -->
  <div id="resultArea">
    <div class="card" style="height:100%">
      <div class="result-header">
        <div class="card-title" style="margin-bottom:0"><span class="icon">📄</span> 생성된 초안</div>
        <button class="btn btn-outline" style="font-size:12px;padding:6px 12px" onclick="copyContent()">📋 복사</button>
      </div>

      <div id="statusBar"></div>

      <p class="section-label">제목</p>
      <input type="text" id="docTitle" placeholder="문서 제목">

      <p class="section-label" style="margin-top:12px">본문</p>
      <textarea id="docBody" placeholder="여기에 초안이 생성됩니다..."></textarea>

      <div class="action-row">
        <button class="btn btn-success" id="sendBtn" onclick="sendToChannelTalk()">
          🚀 채널톡에 임시저장
        </button>
      </div>
    </div>
  </div>

  <!-- Placeholder when no result -->
  <div id="resultPlaceholder" class="card" style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;min-height:300px;color:#bbb;">
    <div style="font-size:48px">✨</div>
    <div style="font-size:15px;font-weight:600;color:#999">내용을 입력하고 초안 생성을 눌러보세요</div>
    <div style="font-size:13px;text-align:center;max-width:260px;line-height:1.6">텍스트와 이미지를 분석해서<br>채널톡 문서 초안을 만들어드려요</div>
  </div>

</main>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal" onclick="closeSettingsIfOutside(event)">
  <div class="modal">
    <h2>⚙️ API 설정</h2>

    <div class="form-group">
      <label>Claude API 키 (Anthropic)
        <span class="hint">🔗 console.anthropic.com에서 발급</span>
      </label>
      <input type="text" id="s_claudeKey" placeholder="sk-ant-api03-...">
    </div>

    <div class="form-group">
      <label>채널톡 Access Key
        <span class="hint">채널톡 Documents → 설정 → API 키에서 발급</span>
      </label>
      <input type="text" id="s_channelKey" placeholder="access_key_...">
    </div>

    <div class="form-group">
      <label>채널톡 Access Secret
        <span class="hint">API 키 발급 시 한 번만 보여요. 안전하게 저장하세요.</span>
      </label>
      <input type="text" id="s_channelSecret" placeholder="access_secret_...">
    </div>

    <div class="form-group">
      <label>채널톡 Space ID (선택)
        <span class="hint">비워두면 $me (기본 스페이스) 사용</span>
      </label>
      <input type="text" id="s_spaceId" placeholder="$me">
    </div>

    <div class="form-group">
      <label>문서 언어 코드
        <span class="hint">ko (한국어), en (영어), ja (일본어) 등</span>
      </label>
      <input type="text" id="s_lang" placeholder="ko">
    </div>

    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeSettings()">취소</button>
      <button class="btn btn-primary" onclick="saveSettings()">💾 저장</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ─── State ───────────────────────────────────────────
let uploadedImages = []; // [{base64, mediaType}]

// ─── Settings ────────────────────────────────────────
function loadSettings() {
  return {
    claudeKey:     localStorage.getItem('ct_claudeKey')     || '',
    channelKey:    localStorage.getItem('ct_channelKey')    || '',
    channelSecret: localStorage.getItem('ct_channelSecret') || '',
    spaceId:       localStorage.getItem('ct_spaceId')       || '$me',
    lang:          localStorage.getItem('ct_lang')          || 'ko',
  };
}

function saveSettings() {
  const s = {
    claudeKey:     document.getElementById('s_claudeKey').value.trim(),
    channelKey:    document.getElementById('s_channelKey').value.trim(),
    channelSecret: document.getElementById('s_channelSecret').value.trim(),
    spaceId:       document.getElementById('s_spaceId').value.trim() || '$me',
    lang:          document.getElementById('s_lang').value.trim()    || 'ko',
  };
  localStorage.setItem('ct_claudeKey',     s.claudeKey);
  localStorage.setItem('ct_channelKey',    s.channelKey);
  localStorage.setItem('ct_channelSecret', s.channelSecret);
  localStorage.setItem('ct_spaceId',       s.spaceId);
  localStorage.setItem('ct_lang',          s.lang);
  closeSettings();
  checkSetup();
  showToast('✅ 설정이 저장됐어요!', 'ok');
}

function checkSetup() {
  const s = loadSettings();
  const ready = s.claudeKey && s.channelKey && s.channelSecret;
  document.getElementById('setupBanner').classList.toggle('show', !ready);
}

function openSettings() {
  const s = loadSettings();
  document.getElementById('s_claudeKey').value     = s.claudeKey;
  document.getElementById('s_channelKey').value    = s.channelKey;
  document.getElementById('s_channelSecret').value = s.channelSecret;
  document.getElementById('s_spaceId').value       = s.spaceId === '$me' ? '' : s.spaceId;
  document.getElementById('s_lang').value          = s.lang;
  document.getElementById('settingsModal').classList.add('open');
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('open');
}

function closeSettingsIfOutside(e) {
  if (e.target === document.getElementById('settingsModal')) closeSettings();
}

// ─── Image Upload ────────────────────────────────────
document.getElementById('fileInput').addEventListener('change', function(e) {
  Array.from(e.target.files).forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      const base64 = ev.target.result.split(',')[1];
      uploadedImages.push({ base64, mediaType: file.type });
      renderPreviews();
    };
    reader.readAsDataURL(file);
  });
  this.value = '';
});

// Drag and drop
const uploadArea = document.getElementById('uploadArea');
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.style.borderColor='#6c5ce7'; });
uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor=''; });
uploadArea.addEventListener('drop', e => {
  e.preventDefault();
  uploadArea.style.borderColor = '';
  Array.from(e.dataTransfer.files).forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const base64 = ev.target.result.split(',')[1];
      uploadedImages.push({ base64, mediaType: file.type });
      renderPreviews();
    };
    reader.readAsDataURL(file);
  });
});

function renderPreviews() {
  const container = document.getElementById('previewImages');
  container.innerHTML = '';
  uploadedImages.forEach((img, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'img-wrap';
    wrap.innerHTML = `
      <img src="data:${img.mediaType};base64,${img.base64}">
      <button class="remove-img" onclick="removeImage(${i})">✕</button>
    `;
    container.appendChild(wrap);
  });
  uploadArea.classList.toggle('has-file', uploadedImages.length > 0);
  uploadArea.querySelector('p').innerHTML = uploadedImages.length > 0
    ? `${uploadedImages.length}개 이미지 첨부됨 · 더 추가하려면 클릭`
    : '클릭해서 이미지 첨부<br><small>JPG, PNG, GIF, WebP</small>';
}

function removeImage(i) {
  uploadedImages.splice(i, 1);
  renderPreviews();
}

// ─── Generate Draft ──────────────────────────────────
async function generateDraft() {
  const s = loadSettings();
  if (!s.claudeKey) {
    showToast('❗ Claude API 키를 먼저 설정해주세요', 'err');
    openSettings();
    return;
  }

  const text = document.getElementById('contentText').value.trim();
  const guidelines = document.getElementById('guidelines').value.trim();

  if (!text && uploadedImages.length === 0) {
    showToast('❗ 텍스트나 이미지를 입력해주세요', 'err');
    return;
  }

  setLoading(true);
  showStatus('loading', '✨ Claude가 초안을 작성 중이에요...');
  showResultArea(true);

  try {
    const systemPrompt = buildSystemPrompt(guidelines);
    const userContent  = buildUserContent(text);

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': s.claudeKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-opus-4-6',
        max_tokens: 4096,
        system: systemPrompt,
        messages: [{ role: 'user', content: userContent }],
      }),
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${response.status}`);
    }

    const data  = await response.json();
    const raw   = data.content[0]?.text || '';
    const parsed = parseDraft(raw);

    document.getElementById('docTitle').value = parsed.title;
    document.getElementById('docBody').value  = parsed.body;

    showStatus('success', '✅ 초안이 생성됐어요! 내용을 확인하고 수정한 다음 채널톡에 올리세요.');

  } catch (err) {
    showStatus('error', `❌ 오류: ${err.message}`);
    console.error(err);
  } finally {
    setLoading(false);
  }
}

function buildSystemPrompt(guidelines) {
  let base = `당신은 전문 기술 문서 작성가입니다. 사용자가 제공한 내용을 바탕으로 채널톡 도움말 문서 초안을 작성해주세요.

응답은 반드시 다음 형식으로 작성하세요:
---TITLE---
문서 제목
---BODY---
문서 본문 (마크다운 형식)`;

  if (guidelines) {
    base += `\n\n추가 지침:\n${guidelines}`;
  }
  return base;
}

function buildUserContent(text) {
  const parts = [];

  if (uploadedImages.length > 0) {
    uploadedImages.forEach(img => {
      parts.push({
        type: 'image',
        source: { type: 'base64', media_type: img.mediaType, data: img.base64 },
      });
    });
  }

  const userText = text
    ? `다음 내용을 바탕으로 채널톡 문서 초안을 작성해주세요:\n\n${text}`
    : '첨부된 이미지를 분석해서 채널톡 문서 초안을 작성해주세요.';

  parts.push({ type: 'text', text: userText });
  return parts;
}

function parseDraft(raw) {
  const titleMatch = raw.match(/---TITLE---\s*([\s\S]*?)---BODY---/);
  const bodyMatch  = raw.match(/---BODY---\s*([\s\S]*?)$/);

  const title = titleMatch ? titleMatch[1].trim() : '새 문서';
  const body  = bodyMatch  ? bodyMatch[1].trim()  : raw.trim();

  return { title, body };
}

// ─── Send to Channel Talk ────────────────────────────
async function sendToChannelTalk() {
  const s = loadSettings();
  if (!s.channelKey || !s.channelSecret) {
    showToast('❗ 채널톡 API 키를 먼저 설정해주세요', 'err');
    openSettings();
    return;
  }

  const title = document.getElementById('docTitle').value.trim();
  const body  = document.getElementById('docBody').value.trim();

  if (!title || !body) {
    showToast('❗ 제목과 본문을 모두 입력해주세요', 'err');
    return;
  }

  setLoading(true, 'send');
  showStatus('loading', '🚀 채널톡에 임시저장 중...');

  try {
    const credentials = btoa(`${s.channelKey}:${s.channelSecret}`);
    const spaceId     = s.spaceId || '$me';
    const url         = `https://document-api.channel.io/open/v1/spaces/${spaceId}/articles`;

    const response = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Basic ${credentials}`,
      },
      body: JSON.stringify({
        title,
        body,
        languageCode: s.lang || 'ko',
        status: 'draft',
      }),
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      // CORS error handling
      if (response.status === 0 || !response.status) {
        throw new Error('CORS 오류: 채널톡 API가 브라우저 직접 호출을 막고 있어요. 아래 "복사" 버튼으로 내용을 복사한 뒤 채널톡에 직접 붙여넣어 주세요.');
      }
      throw new Error(err.message || err.error?.message || `HTTP ${response.status}`);
    }

    const data = await response.json();
    showStatus('success', `✅ 채널톡에 임시저장 됐어요! 아티클 ID: ${data.article?.id || data.id || '확인됨'}`);
    showToast('🎉 채널톡 임시저장 완료!', 'ok');

  } catch (err) {
    const msg = err.message || String(err);
    // Network error (often CORS)
    if (msg.includes('Failed to fetch') || msg.includes('NetworkError')) {
      showStatus('error', '❌ 네트워크 오류: 채널톡 API에 연결할 수 없어요. CORS 문제일 수 있어요. 복사 버튼으로 내용을 복사한 뒤 채널톡 에디터에 직접 붙여넣어 주세요.');
    } else {
      showStatus('error', `❌ 오류: ${msg}`);
    }
    console.error(err);
  } finally {
    setLoading(false, 'send');
  }
}

// ─── Helpers ─────────────────────────────────────────
function setLoading(on, which) {
  const genBtn  = document.getElementById('generateBtn');
  const sendBtn = document.getElementById('sendBtn');
  if (which === 'send') {
    sendBtn.disabled = on;
    sendBtn.innerHTML = on ? '<span class="spinner"></span> 업로드 중...' : '🚀 채널톡에 임시저장';
  } else {
    genBtn.disabled = on;
    genBtn.innerHTML = on ? '<span class="spinner"></span> 작성 중...' : '✨ 초안 생성';
  }
}

function showStatus(type, msg) {
  const bar = document.getElementById('statusBar');
  bar.className = type;
  if (type === 'loading') {
    bar.innerHTML = `<div class="spinner"></div><span>${msg}</span>`;
  } else {
    bar.innerHTML = `<span>${msg}</span>`;
  }
}

function showResultArea(show) {
  document.getElementById('resultArea').style.display      = show ? 'block' : 'none';
  document.getElementById('resultPlaceholder').style.display = show ? 'none' : 'flex';
}

function clearAll() {
  document.getElementById('contentText').value = '';
  document.getElementById('guidelines').value  = '';
  document.getElementById('docTitle').value    = '';
  document.getElementById('docBody').value     = '';
  uploadedImages = [];
  renderPreviews();
  showResultArea(false);
}

function copyContent() {
  const title = document.getElementById('docTitle').value;
  const body  = document.getElementById('docBody').value;
  const text  = `# ${title}\n\n${body}`;
  navigator.clipboard.writeText(text).then(() => {
    showToast('📋 클립보드에 복사됐어요!', 'ok');
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('📋 복사됐어요!', 'ok');
  });
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `show ${type || ''}`;
  setTimeout(() => { t.className = ''; }, 3200);
}

// ─── Init ────────────────────────────────────────────
checkSetup();
