<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CX 에러 수집기</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- 헤더 -->
  <header>
    <span class="logo">🔍</span>
    <span class="title">CX 에러 수집기</span>
    <span id="status-badge" class="badge badge-idle">대기중</span>
  </header>

  <!-- 화면 1: 대기 -->
  <section id="screen-idle" class="screen active">
    <p class="desc">녹화를 시작하면 HTTP 에러, 느린 요청,<br>콘솔 에러를 자동으로 수집합니다.</p>
    <button id="btn-start" class="btn btn-primary">▶ 녹화 시작</button>

    <div id="history-section" class="history-section hidden">
      <div class="history-header">
        <span>이전 기록</span>
        <button id="btn-clear-history" class="btn-text">전체 삭제</button>
      </div>
      <div id="history-list" class="history-list"></div>
    </div>
  </section>

  <!-- 화면 2: 녹화 중 -->
  <section id="screen-recording" class="screen">
    <div class="recording-indicator">
      <span class="dot"></span> 녹화 중...
    </div>
    <div class="counters">
      <div class="counter">
        <span id="cnt-errors" class="count">0</span>
        <span class="label">HTTP 에러</span>
      </div>
      <div class="counter">
        <span id="cnt-slow" class="count">0</span>
        <span class="label">느린 요청</span>
      </div>
      <div class="counter">
        <span id="cnt-console" class="count">0</span>
        <span class="label">콘솔 에러</span>
      </div>
    </div>
    <p class="hint">문제를 재현한 후 아래 버튼을 누르세요.</p>
    <button id="btn-stop" class="btn btn-danger">■ 녹화 끝</button>
  </section>

  <!-- 화면 3: 결과 -->
  <section id="screen-result" class="screen">
    <div id="summary-header" class="summary-header">
      <button id="btn-back" class="btn-back">← 목록</button>
      <span id="summary-total" class="total-count">0개 이슈</span>
      <span id="summary-time" class="summary-time"></span>
    </div>

    <div id="event-list" class="event-list"></div>

    <div class="actions">
      <button id="btn-copy" class="btn btn-secondary">📋 복사</button>
      <button id="btn-download" class="btn btn-secondary">⬇ JSON 다운로드</button>
      <button id="btn-reset" class="btn btn-outline">새 녹화 시작</button>
    </div>

    <div id="copy-toast" class="toast hidden">클립보드에 복사됐습니다!</div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
